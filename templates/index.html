<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exact Eyeglass Color Extractor</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #0d1322;
    color: #e2e8f0;
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px;
  }
  
  /* Header Section */
  .header { text-align: center; margin-bottom: 28px; }
  h1 { font-size: 28px; font-weight: 700; margin: 0 0 8px 0; color: #ffffff; }
  .subtitle { color: #8a99ad; font-size: 15px; margin: 0; }
  
  /* Input Card / Container */
  .card {
    background: #172033;
    border: 1px solid #232f48;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
  }

  /* Tabs Styling */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid #232f48; padding-bottom: 12px; }
  .tab-btn {
    padding: 8px 16px;
    border: 1px solid #283754;
    background: #101726;
    color: #8a99ad;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .tab-btn:hover { background: #1a253b; color: #fff; }
  .tab-btn.active { background: #6366f1; color: #ffffff; border-color: #6366f1; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* Input Elements */
  .input-row { display: flex; gap: 12px; }
  input[type=text] {
    flex: 1;
    padding: 12px 16px;
    font-size: 14px;
    background: #0d1322;
    border: 1px solid #283754;
    border-radius: 8px;
    color: #38bdf8;
    outline: none;
  }
  input[type=text]:focus { border-color: #6366f1; }
  
  input[type=file] {
    flex: 1;
    padding: 10px;
    font-size: 13px;
    background: #0d1322;
    border: 1px dashed #283754;
    border-radius: 8px;
    color: #8a99ad;
  }

  /* Purple Action Button */
  button.action-btn {
    padding: 12px 22px;
    background: #6366f1;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.2s ease;
    white-space: nowrap;
  }
  button.action-btn:hover { background: #4f46e5; }
  button.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Grid Layout for Preview and Results */
  .results-grid {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 20px;
    margin-top: 20px;
  }
  @media (max-width: 640px) {
    .results-grid { grid-template-columns: 1fr; }
  }

  /* Left Side: Image Box */
  .image-box {
    background: #172033;
    border: 1px solid #232f48;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .preview-wrapper {
    background: #ffffff;
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 180px;
  }
  .preview-wrapper img { max-width: 100%; height: auto; max-height: 220px; object-fit: contain; }
  .image-dim { margin-top: 12px; font-size: 13px; color: #8a99ad; font-weight: 500; }

  /* Right Side: Color Swatches Stack */
  .swatch-list { display: flex; flex-direction: column; gap: 12px; }
  .swatch-card {
    background: #172033;
    border: 1px solid #232f48;
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .swatch-box {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    flex-shrink: 0;
  }
  .swatch-info { display: flex; flex-direction: column; gap: 2px; }
  .swatch-label { font-size: 12px; color: #8a99ad; font-weight: 500; }
  .swatch-hex { font-size: 18px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }
  .swatch-pct { font-size: 12px; color: #64748b; }
  .multi-badge {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 7px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #172033;
    background: #38bdf8;
    border-radius: 999px;
    vertical-align: middle;
  }

  /* Bulk Table Styling */
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
  th, td { border: 1px solid #232f48; padding: 10px; text-align: left; }
  th { background: #101726; color: #8a99ad; }
  .hexcell { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .hexdot { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #fff; display: inline-block; flex-shrink: 0; }
  .hexchip { display: inline-flex; align-items: center; gap: 4px; margin-right: 6px; }
  
  #exportBtn { background: #10b981; margin-top: 12px; }
  #exportBtn:hover { background: #059669; }
  #error { color: #ef4444; margin-top: 12px; font-size: 14px; text-align: center; }
  #diag { font-size: 12px; color: #64748b; margin-top: 16px; text-align: center; }
</style>
</head>
<body>

  <div class="header">
    <h1>Exact Eyeglass Color Extractor</h1>
    <p class="subtitle">Accurate Frame, Tint, and Temple Leg Color Extractor</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" data-tab="single-url">Single URL</button>
      <button class="tab-btn" data-tab="single-file">Upload Image</button>
      <button class="tab-btn" data-tab="bulk">Bulk Import</button>
    </div>

    <!-- Single URL Panel -->
    <div class="panel active" id="single-url">
      <div class="input-row">
        <input type="text" id="url" placeholder="https://example.com/glasses.jpg">
        <button class="action-btn" id="go">Extract Colors</button>
      </div>
    </div>

    <!-- Upload Image Panel -->
    <div class="panel" id="single-file">
      <div class="input-row">
        <input type="file" id="imgFile" accept="image/*">
        <button class="action-btn" id="goFile">Extract Colors</button>
      </div>
    </div>

    <!-- Bulk Import Panel -->
    <div class="panel" id="bulk">
      <p style="font-size:13px; color:#8a99ad; margin-top:0;">
        Upload a .csv or .txt file containing CDN image URLs — every URL in the file will be processed, no limit.
      </p>
      <div class="input-row">
        <input type="file" id="bulkFile" accept=".csv,.txt">
        <button class="action-btn" id="goBulk">Process All</button>
      </div>
      <div id="bulkProgress" style="font-size:12px; color:#8a99ad; margin-top:10px;"></div>
      <button class="action-btn" id="exportBtn" style="display:none;">Export to CSV</button>
      <div id="bulkTableWrap"></div>
    </div>
  </div>

  <div id="error"></div>

  <!-- Output Layout: Image Display on Left, Swatches on Right -->
  <div class="results-grid" id="resultsContainer" style="display:none;">
    <div class="image-box">
      <div class="preview-wrapper">
        <img id="previewImg" src="" alt="Eyeglasses Preview">
      </div>
      <div class="image-dim" id="imgDimensions">Dimensions: -</div>
    </div>

    <div class="swatch-list" id="swatchList"></div>
  </div>

  <div id="diag"></div>

<script>
// Tab Switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    document.getElementById('error').textContent = '';
    document.getElementById('diag').textContent = '';
  });
});

// Render Swatch Cards in Dark Theme Style
function renderColorRows(colors, imgUrl, dimensions) {
  const container = document.getElementById('resultsContainer');
  const swatchList = document.getElementById('swatchList');
  const previewImg = document.getElementById('previewImg');
  const dimensionsEl = document.getElementById('imgDimensions');

  swatchList.innerHTML = '';
  
  if (imgUrl) {
    previewImg.src = imgUrl;
  }
  dimensionsEl.textContent = `Dimensions: ${dimensions || 'N/A'}`;

  colors.forEach(c => {
    const card = document.createElement('div');
    card.className = 'swatch-card';

    const swatch = document.createElement('div');
    swatch.className = 'swatch-box';
    swatch.style.backgroundColor = c.hex || '#1f2937';

    const info = document.createElement('div');
    info.className = 'swatch-info';

    // Extra frame colors from a multi-color / two-tone frame get a small
    // badge next to the label so they're easy to spot in the swatch list.
    const isExtraFrameColor = c.label.startsWith('Frame Color ');
    const labelHtml = isExtraFrameColor
      ? `${c.label.replace(' (Multi-Color Frame)', '')}<span class="multi-badge">multi-color</span>`
      : c.label;

    let html = `<div class="swatch-label">${labelHtml}</div>`;
    if (c.hex) {
      html += `<div class="swatch-hex">${c.hex}</div>`;
      html += `<div class="swatch-pct">${c.percentage}% of pixels</div>`;
    } else {
      html += `<div class="swatch-pct" style="color:#f59e0b;">${c.note || 'Not detected'}</div>`;
    }

    info.innerHTML = html;
    card.appendChild(swatch);
    card.appendChild(info);
    swatchList.appendChild(card);
  });

  container.style.display = 'grid';
}

// Single File Upload
document.getElementById('goFile').addEventListener('click', async () => {
  const fileInput = document.getElementById('imgFile');
  const errorEl = document.getElementById('error');
  const diagEl = document.getElementById('diag');
  errorEl.textContent = '';
  diagEl.textContent = '';

  if (!fileInput.files.length) { errorEl.textContent = 'Choose an image file.'; return; }

  const btn = document.getElementById('goFile');
  btn.disabled = true;
  btn.textContent = 'Extracting...';

  try {
    const fd = new FormData();
    const file = fileInput.files[0];
    fd.append('image', file);
    
    const resp = await fetch('/extract_file', { method: 'POST', body: fd });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Extraction failed');

    const tempUrl = URL.createObjectURL(file);
    renderColorRows(data.colors, tempUrl, data.dimensions);
    diagEl.textContent = `rembg available: ${data.meta.rembg_used} · lens region found: ${data.meta.lens_region_detected} · multi-color frame: ${data.meta.multi_color_frame}`;
  } catch (e) {
    errorEl.textContent = e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Extract Colors';
  }
});

// Single URL Processing
document.getElementById('go').addEventListener('click', async () => {
  const url = document.getElementById('url').value.trim();
  const errorEl = document.getElementById('error');
  const diagEl = document.getElementById('diag');
  errorEl.textContent = '';
  diagEl.textContent = '';

  if (!url) { errorEl.textContent = 'Enter an image URL.'; return; }

  const btn = document.getElementById('go');
  btn.disabled = true;
  btn.textContent = 'Extracting...';

  try {
    const resp = await fetch('/extract', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url})
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Extraction failed');

    renderColorRows(data.colors, url, data.dimensions);
    diagEl.textContent = `rembg available: ${data.meta ? data.meta.rembg_used : 'N/A'} · multi-color frame: ${data.meta ? data.meta.multi_color_frame : 'N/A'}`;
  } catch (e) {
    errorEl.textContent = e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Extract Colors';
  }
});

// Bulk Import
let lastBulkRows = [];
document.getElementById('goBulk').addEventListener('click', async () => {
  const fileInput = document.getElementById('bulkFile');
  const errorEl = document.getElementById('error');
  const progressEl = document.getElementById('bulkProgress');
  errorEl.textContent = '';
  progressEl.textContent = '';
  if (!fileInput.files.length) { errorEl.textContent = 'Choose a .csv or .txt file.'; return; }

  const btn = document.getElementById('goBulk');
  btn.disabled = true;
  btn.textContent = 'Processing...';
  progressEl.textContent = 'Processing every URL in the file — this can take a while for large lists, please keep this tab open.';

  try {
    const fd = new FormData();
    fd.append('urls_file', fileInput.files[0]);
    const resp = await fetch('/bulk_extract', { method: 'POST', body: fd });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Bulk extraction failed');

    lastBulkRows = data.rows;
    renderBulkTable(lastBulkRows);
    progressEl.textContent = `Done — processed ${data.count} URL${data.count === 1 ? '' : 's'}.`;
    document.getElementById('exportBtn').style.display = 'inline-block';
  } catch (e) {
    errorEl.textContent = e.message;
    progressEl.textContent = '';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Process All';
  }
});

// Renders one or more " | "-separated hex codes in a single table cell,
// each with its own color dot -- used for the Frame column so multi-color
// / two-tone frames show every detected hex, not just the first one.
function renderHexCell(hexStr) {
  if (!hexStr) return '—';
  const hexes = hexStr.split('|').map(h => h.trim()).filter(Boolean);
  if (!hexes.length) return '—';
  return `<span class="hexcell">${hexes.map(h =>
    `<span class="hexchip"><span class="hexdot" style="background:${h}"></span>${h}</span>`
  ).join('')}</span>`;
}

function renderBulkTable(rows) {
  const wrap = document.getElementById('bulkTableWrap');
  if (!rows.length) { wrap.innerHTML = ''; return; }

  const cols = [
    ['url', 'URL'], ['dimensions', 'Size'],
    ['frame_hex', 'Frame'], ['temple_hex', 'Temple'],
    ['accent_hex', 'Accent'], ['tint_hex', 'Tint']
  ];

  let html = '<table><thead><tr>' + cols.map(c => `<th>${c[1]}</th>`).join('') + '</tr></thead><tbody>';
  rows.forEach(r => {
    html += '<tr>';
    cols.forEach(([key]) => {
      if (key.endsWith('_hex')) {
        html += `<td>${renderHexCell(r[key])}</td>`;
      } else {
        html += `<td>${r[key] || '—'}</td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

// Export CSV Action
document.getElementById('exportBtn').addEventListener('click', async () => {
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';

  try {
    const resp = await fetch('/export', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'text/csv'
      },
      body: JSON.stringify({ rows: lastBulkRows }),
    });

    if (!resp.ok) {
      const data = await resp.json();
      throw new Error(data.error || 'Export failed');
    }

    // Convert response stream to blob download
    const blob = await resp.blob();
    const downloadUrl = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = downloadUrl;
    a.download = 'eyeglass_colors_export.csv';
    
    document.body.appendChild(a);
    a.click();
    
    // Revoke URL to prevent memory leaks
    window.URL.revokeObjectURL(downloadUrl);
    a.remove();
  } catch (e) {
    errorEl.textContent = e.message;
  }
});
</script>
</body>
</html>
